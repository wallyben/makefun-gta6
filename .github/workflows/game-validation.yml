name: Validate browser game
on:
  push:
  pull_request:
jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check game/game.js
      - name: Check entrypoints and game UI
        run: node --test tests/game.test.mjs
