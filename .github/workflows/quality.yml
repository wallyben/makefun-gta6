name: Quality Gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify offline game and scripts
        run: |
          test -f game/index.html
          test -f game/game.js
          test -f LICENSE
          node --check game/game.js
          node --check game.js
          node --test tests/*.test.mjs
          node -e "const fs=require('fs');const h=fs.readFileSync('game/index.html','utf8');if(!h.includes('./game.js')||!h.includes('id=\"world\"'))process.exit(1)"
      - name: Report official submission readiness (diagnostic only)
        shell: bash
        run: |
          set +e
          node scripts/submission-preflight.mjs > submission-preflight.json
          result=$?
          cat submission-preflight.json
          {
            echo '### Official submission preflight'
            echo ''
            echo 'This is diagnostic; gameplay CI passing does **not** imply competition eligibility.'
            echo ''
            echo '~~~json'
            cat submission-preflight.json
            echo '~~~'
            echo ''
            echo "Preflight exit code: $result"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload preflight report
        uses: actions/upload-artifact@v4
        with:
          name: submission-preflight
          path: submission-preflight.json
          retention-days: 7

  eligibility:
    name: Submission eligibility (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required submission artifacts
        shell: bash
        run: |
          set +e
          node scripts/submission-preflight.mjs > submission-preflight-strict.json
          result=$?
          cat submission-preflight-strict.json
          echo "Official submission preflight exit code: $result" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Upload strict eligibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-preflight-strict
          path: submission-preflight-strict.json
          if-no-files-found: warn
          retention-days: 7
