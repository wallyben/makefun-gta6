name: Quality Gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify offline game and scripts
        run: |
          test -f game/index.html
          test -f game/game.js
          test -f LICENSE
          node --check game/game.js
          node --check game.js
          node --test tests/*.test.mjs
          node -e "const fs=require('fs');const h=fs.readFileSync('game/index.html','utf8');if(!h.includes('./game.js')||!h.includes('id=\"world\"'))process.exit(1)"
